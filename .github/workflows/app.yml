name: Programm bauen

# Baut Pult als normales Programm: Mac (Apple-Chip und Intel) und Windows.
# Ein neues Release entsteht von selbst: Steht in package.json eine Version, zu der es noch kein Release "v<Version>" gibt,
# baut GitHub beim nächsten Stand auf main die Dateien und legt das Release an (Downloads unter "Releases").
# Von Hand starten (Actions, "Programm bauen", "Run workflow") geht auch: dann liegen die Dateien 14 Tage unter "Artifacts".
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    name: Neue Version?
    runs-on: ubuntu-latest
    outputs:
      neu: ${{ steps.pruefen.outputs.neu }}
      version: ${{ steps.pruefen.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pruefen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && ! gh release view "v$v" >/dev/null 2>&1; then echo "neu=true" >> "$GITHUB_OUTPUT"; else echo "neu=false" >> "$GITHUB_OUTPUT"; fi

  bauen:
    needs: version
    name: ${{ matrix.name }}
    # Die Installationsdateien nur von Hand oder bei einer neuen Version, nicht bei jedem Stand auf main.
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.neu == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Mac (Apple-Chip), os: macos-latest, args: "--mac --arm64" }
          - { name: Mac (Intel), os: macos-15-intel, args: "--mac --x64" }
          - { name: Windows, os: windows-latest, args: "--win --x64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      # Der Stand im Programm, damit der Update-Knopf weiß, welche Version installiert ist.
      - run: node -e "require('fs').writeFileSync('.pult-stand', process.env.GITHUB_SHA)"
      # Ohne Zertifikat: Das Programm ist unsigniert, Mac und Windows zeigen beim ersten Öffnen eine Warnung (siehe docs/programm.md).
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: pult-${{ matrix.os }}
          path: |
            release-app/*.dmg
            release-app/*.exe
          if-no-files-found: error
          retention-days: 14

  veroeffentlichen:
    name: Release anlegen
    needs: [version, bauen]
    if: needs.version.outputs.neu == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dateien
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" dateien/*.dmg dateien/*.exe -R "${{ github.repository }}" --target "${{ github.sha }}" --title "Pult ${{ needs.version.outputs.version }}" --notes "Pult als Programm. Mac: die .dmg-Datei (arm64 = Apple-Chip, x64 = Intel), Windows: die .exe-Datei. Beim ersten Öffnen kommt eine Warnung, die Anleitung steht in docs/programm.md."

  # Die kleinen Updates für den Update-Knopf im Programm: Pults eigener Code (ohne Bibliotheken und ohne Programmhülle).
  # Liegt immer unter dem Release "code" und wird bei jedem Stand auf main ersetzt.
  code:
    name: Update-Paket
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run code-paket
      - name: Release "code" ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view code >/dev/null 2>&1 || gh release create code --prerelease --title "Update-Paket (automatisch)" --notes "Wird bei jedem Stand auf main ersetzt. Nicht von Hand herunterladen: Pult holt es selbst über den Update-Knopf."
          gh release upload code code-paket/code.zip code-paket/code.json --clobber

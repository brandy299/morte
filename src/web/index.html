<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>morte</title>
    <script>
      // Sets the saved look before the first paint, so a dark window does not flash light (same rules as theme.ts).
      try {
        var l = JSON.parse(localStorage.getItem("morte-aussehen") || "{}");
        var d = document.documentElement;
        d.dataset.theme = l.mode === "dunkel" || (l.mode !== "hell" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

name: Programm bauen

# Baut Pult als normales Programm: Mac (Apple-Chip und Intel) und Windows.
# Von Hand starten (Actions, "Programm bauen", "Run workflow") oder mit einem Tag wie v0.2.0: dann landen die Dateien
# als Download bei den Releases. Ohne Tag liegen sie 14 Tage lang unter "Artifacts" des Laufs.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bauen:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Mac (Apple-Chip), os: macos-latest, args: "--mac --arm64" }
          - { name: Mac (Intel), os: macos-15-intel, args: "--mac --x64" }
          - { name: Windows, os: windows-latest, args: "--win --x64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      # Ohne Zertifikat: Das Programm ist unsigniert, Mac und Windows zeigen beim ersten Öffnen eine Warnung (siehe docs/programm.md).
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: pult-${{ matrix.os }}
          path: |
            release-app/*.dmg
            release-app/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-app/*.dmg
            release-app/*.exe
